<!doctype html>
<html><head><meta charset="utf-8"><title>morph</title></head>
<body><div id="app"></div>
<script>
// A page whose structure keeps changing into new shapes: tests the per-page screen limit.
let n = 0;
setInterval(() => {
  n++;
  const app = document.getElementById('app');
  // every n gives a really different shape: its bits decide the tags and the nesting
  const box = document.createElement('section');
  let cur = box;
  for (let b = 0; b < 9; b++) {
    const e = document.createElement((n >> b) & 1 ? 'article' : 'aside');
    e.className = ['alpha', 'beta', 'gamma'][b % 3];
    e.textContent = 'x';
    cur.append(e);
    if ((n >> b) & 1) cur = e;
  }
  app.replaceChildren(box);
}, 250);
</script>
<form><input type="password" class="pwd" placeholder="Password"><input type="text" class="login" placeholder="Login"></form>
</body></html>
