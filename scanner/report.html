<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Звіт сканера</title>
<style>
  :root { --bg:#121014; --card:#1c1920; --line:#2e2934; --ink:#f2eef4; --muted:#9b92a3; --accent:#e64980; --ok:#51cf66; --err:#ff6b6b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 620px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  li.run { color: var(--muted); } li.ok { color: var(--ok); } li.err { color: var(--err); }
  a.dl { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; }
  button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; }
  .muted { color: var(--muted); } [hidden] { display: none !important; }
  code { color: #ffd8e6; }
</style></head>
<body>
<main>
  <h1>📦 Звіт сканера</h1>
  <div class="card"><ol id="steps"></ol></div>
  <div id="result" class="card" hidden>
    <p><b>Готово.</b> Файл скачався в «Завантаження». Якщо ні — натисніть:</p>
    <p><a id="dl" class="dl" href="#">⬇ Скачати</a></p>
    <p>Надішліть файл <code id="fname"></code> розробнику (Telegram / пошта). Запис при цьому <b>не зупиняється</b>.</p>
  </div>
  <p class="muted">Звіт збирається на вашому комп’ютері й нікуди сам не відправляється. <button id="go">↻ Зібрати ще раз</button></p>
</main>
<script src="dict.js"></script><script src="roles.js"></script><script src="db.js"></script><script src="report.js"></script>
</body>
</html>
