<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Agency Bot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icon32.png" alt="" width="20" height="20">
    <strong>Agency Bot</strong>
    <span id="who" class="muted"></span>
    <button id="logout" class="link" hidden>Вийти</button>
  </header>

  <section id="login-view" hidden>
    <form id="login-form">
      <label>Адреса панелі<input id="server" type="text" required placeholder="https://ваша-панель.up.railway.app"></label>
      <p class="muted small">Те, що в рядку браузера, коли відкрита панель</p>
      <label>Логін (email)<input id="email" type="text" required autocomplete="username"></label>
      <label>Пароль<input id="password" type="password" required autocomplete="current-password"></label>
      <button type="submit" class="primary">Увійти</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="main-view" hidden>
    <div id="update" class="update" hidden></div>
    <p id="hint" class="hint">Відкрийте сайт і увійдіть. Бот сам знайде ваші анкети й працюватиме по всіх.</p>
    <label class="check" title="Бот проходить увесь шлях на сайті за кожну анкету, але нічого не надсилає. Ліміт не витрачається.">
      <input type="checkbox" id="test-mode">
      <span>🧪 Тестовий режим <span class="muted">— усе, крім «Надіслати»</span></span>
    </label>
    <button id="start" class="primary big">▶ Увімкнути</button>
    <button id="stop" class="danger big" hidden>⏹ Вимкнути</button>

    <div id="status" class="card">
      <div class="status-line"><span id="dot" class="dot"></span><b id="status-text">Вимкнено</b></div>
      <div id="status-msg" class="muted small"></div>
      <div class="stats">
        <div><b id="s-sent">0</b><span id="s-sent-label">надіслано</span></div>
        <div><b id="s-replies">0</b><span>відповідей</span></div>
        <div><b id="s-profile">—</b><span>зараз анкета</span></div>
      </div>
    </div>

    <ol id="log" class="log"></ol>
    <p id="main-error" class="error" role="alert"></p>
    <a id="panel-link" href="#" target="_blank" class="small">Відкрити панель →</a>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
